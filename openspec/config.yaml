schema: spec-driven
skillsScope: project

context: |
  In OpenChamber, each change runs in its own worktree named after the change id,
  on `openspec/<change-id>`; the steps below run inside it. Elsewhere they run in
  the main checkout.

  Every OpenSpec change ships through a plan PR: a draft pull request holding the
  artifacts, opened before implementation.

  1. Cut `openspec/<change-id>` from `master`.
  2. Commit `openspec/changes/<change-id>/` and push the branch.
  3. Open the draft PR against `master`. Title: the change title. Body: the
     proposal's Why and What Changes, the task list, and a line that this is a
     plan awaiting approval.
  4. End the run with the plan PR open. Implementation starts in a separate apply
     run after approval.

  Bug fixes and version bumps need no OpenSpec change.

operations:
  apply:
    guidance:
      - Apply begins only when `openspec/<change-id>` and its plan PR exist; otherwise stop and report what is missing.
      - Commit after each completed task.
      - Archive on the change branch as its own commit, push once, and run `gh pr ready`. The maintainer merges.
